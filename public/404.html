<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shikashvik Welfare Foundation</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages & Custom Domain Hash Redirect
      var path = window.location.pathname;
      var repoName = '/NGO1';
      var cleanPath = path;
      var base = '';
      if (path.indexOf(repoName) === 0) {
        cleanPath = path.substring(repoName.length);
        base = repoName;
      }
      if (cleanPath.startsWith('/')) {
        cleanPath = cleanPath.substring(1);
      }
      var target = base + '/#/' + cleanPath + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 60px 20px; background: #f8fafc; color: #1e1b4b;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;">
      <h2 style="color: #4b087d; margin-top: 0;">Shikashvik Welfare Foundation</h2>
      <p style="color: #64748b; font-size: 15px;">Loading page, please wait a moment...</p>
      <div style="margin: 20px 0;">
        <span style="display: inline-block; width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #4b087d; border-radius: 50%; animation: spin 1s linear infinite;"></span>
      </div>
      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>
  </body>
</html>
