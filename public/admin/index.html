<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shikashvik Welfare Foundation - Central Admin Portal</title>
    <script type="text/javascript">
      var path = window.location.pathname;
      var repoName = '/NGO1';
      var base = '';
      if (path.indexOf(repoName) === 0) {
        base = repoName;
      }
      var target = base + '/#/admin' + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 60px 20px; background: #0b0f19; color: #f8fafc;">
    <div style="max-width: 480px; margin: 40px auto; background: #161e2e; padding: 36px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 20px 40px rgba(0,0,0,0.4);">
      <div style="font-size: 42px; margin-bottom: 12px;">🔐</div>
      <h2 style="color: #60a5fa; margin: 0 0 8px 0; font-size: 22px;">Shikashvik Admin Portal</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-bottom: 24px;">Authenticating & opening Central Administration Desk...</p>
      <div style="margin: 20px 0;">
        <span style="display: inline-block; width: 34px; height: 34px; border: 3px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></span>
      </div>
      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      <p style="font-size: 13px; color: #64748b; margin-top: 24px;">
        If not redirected automatically, <a href="../#/admin" style="color: #38bdf8; text-decoration: underline; font-weight: bold;">click here to enter Admin Portal</a>
      </p>
    </div>
  </body>
</html>
